server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: localstack:4566
      region: us-east-1
      access_key: test
      secret_key: test
      insecure: true
      forcepathstyle: true
    wal:
      path: /tmp/tempo/wal

query_frontend:
  search:
    max_duration: 0s
